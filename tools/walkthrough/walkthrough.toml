]

[[file]]
path = "crates/ikigai-core/src/content.rs"
title = "ikigai-core / content.rs"
subtitle = "Content addresses — BLAKE3, rendered b3:<hex>"
[[file.note]]
anchor = "pub struct ContentId([u8; 32])"
bullets = [
  "A `ContentId` is a BLAKE3 digest: equal content yields an equal id, which is what makes the cache de-duplicating.",
  "The `b3:` prefix names the algorithm — room for agility, and the on-ramp to a real multihash/CID at the persistence edge.",
]
[[file.note]]
anchor = "pub fn of(bytes: &[u8])"
bullets = [
  "`of` hashes a slice; `from_hasher` finalizes the streaming encodings used for requests and representations.",
  "BLAKE3 chosen for crypto strength (the id is a security boundary), speed on the hash-everything hot path, and a pure-Rust / WASM-clean build.",
]

[[file]]
path = "crates/ikigai-core/src/repr.rs"
title = "ikigai-core / repr.rs"
subtitle = "Representation types, expiry, and the typed value"
[[file.note]]
anchor = "pub struct ReprType"
bullets = [
  "A media type plus sorted parameters — `charset`, parse format — kept canonical so the cache never conflates a UTF-8 decode with a Latin-1 decode of the same bytes.",
]
[[file.note]]
anchor = "pub enum Expiry"
bullets = [
  "Two ends of the spectrum for now: `Always` (uncacheable — the safe default; an endpoint must opt in) and `Never` (a pure function of content-addressed inputs).",
  "The middle — dependency-tracked / golden-thread expiry — lands with live invalidation.",
]
[[file.note]]
anchor = "pub fn content_id(&self)"
bullets = [
  "A representation's identity folds in both its type and its bytes — so the same bytes under different types are different resources.",
  "`cacheable()` is the opt-in: build defaults to uncacheable, then flip to `Never` only when the result is genuinely pure.",
]

[[file]]
path = "crates/ikigai-core/src/arg.rs"
title = "ikigai-core / arg.rs"
subtitle = "Argument channels — reference, inline, content"
[[file.note]]
anchor = "pub enum ArgRef"
bullets = [
  "Three ways a value reaches a request: `Reference(Iri)` (resolve it later — a dependency edge), `Inline(bytes)` (a small literal), `Content(id)` (a large interned value).",
  "By-value args are content-addressed, so two callers passing the same value share a request identity — cache reuse, and the cure for the fresh-id-per-literal problem.",
]

[[file]]
path = "crates/ikigai-core/src/hashing.rs"
title = "ikigai-core / hashing.rs"
subtitle = "Canonical, prefix-free hashing helpers"
[[file.note]]
anchor = "pub(crate) fn feed_bytes"
bullets = [
  "Every variable-length field is length-prefixed, so distinct field sequences can never collide into the same digest.",
  "All hashed encodings flow through these helpers — identity correctness depends on one deterministic encoding, not scattered ad-hoc ones.",
]

[[file]]
path = "crates/ikigai-core/src/request.rs"
title = "ikigai-core / request.rs"
subtitle = "A request and its content-addressed identity"
[[file.note]]
anchor = "pub struct Request {"
bullets = [
  "A verb, a target IRI, and named arguments in a sorted `BTreeMap` — so identity depends on the set of arguments, never their insertion order.",
]
[[file.note]]
anchor = "pub fn id(&self)"
bullets = [
  "The `RequestId` is a BLAKE3 of (verb, target, arguments) — itself a content address of the computation, and the kernel's cache key.",
  "Each `ArgRef` variant hashes distinctly: a `Reference` folds in its IRI, an `Inline` its bytes — so a grammar binding (in the IRI) and a by-value arg both reach the key, by different routes.",
]

[[file]]
path = "crates/ikigai-core/src/grammar.rs"
title = "ikigai-core / grammar.rs"
subtitle = "Grammars: match an identifier, capture bindings"
[[file.note]]
anchor = "pub struct Exact(String)"
bullets = [
  "`Grammar` is the resolution seam: match an IRI, optionally capture `Bindings`. `Exact` matches one identifier and captures nothing.",
  "`pattern()` (used by space enumeration) defaults to uninformative and is overridden per grammar — additive, so future custom grammars need not implement it.",
]
[[file.note]]
anchor = "pub struct UriTemplate"
bullets = [
  "A constrained RFC 6570 template — Level 1 `{var}` only. Matching (not expansion) is the hard direction, kept deterministic: literals match verbatim, a `{var}` captures up to the next literal.",
  "Adjacent variables are rejected at construction as ambiguous. Richer constrained/typed grammars slot in beside this as new `Grammar` impls, no change here.",
]

[[file]]
path = "crates/ikigai-core/src/endpoint.rs"
title = "ikigai-core / endpoint.rs"
subtitle = "Endpoints, the invocation context, and the issuer"
[[file.note]]
anchor = "pub trait Issuer"
bullets = [
  "`Issuer` is how an endpoint issues sub-requests back through the kernel — implemented by the `Kernel`. A detached invocation has none, so endpoints can be tested in isolation.",
]
[[file.note]]
anchor = "pub struct Invocation"
bullets = [
  "All input arrives through the `Invocation`: the request, grammar bindings, the authorizing capability, and (when the kernel drives) the ability to source sub-requests. No ambient authority.",
  "`source` / `issue` record each sub-result's expiry as a dependency, so cacheability propagates: a result is `Never` only if it opted in and every dependency it read is too.",
]
[[file.note]]
anchor = "pub trait Endpoint"
bullets = [
  "`invoke` is `async` (dyn via `async-trait`, which boxes the future) — runtime-free, so the core stays executor-agnostic and WASM-able; the executor is chosen at the edge.",
  "`describe()` returns a structured, RDF-agnostic `Description`; the kernel routes `Meta` through it.",
]
[[file.note]]
anchor = "pub fn with_description"
bullets = [
  "`FnEndpoint` wraps a plain closure — the simplest endpoint. `with_description` lets it declare its full parameter contract; without one, `describe()` reports just the name.",
]

