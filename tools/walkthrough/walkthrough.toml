# Annotation manifest for the ikigai code walkthrough.
#
# Prose only — every code snippet is sliced live from the committed source by
# generate.py, so this file never duplicates code. Each [[file]] names a source
# file; each [[file.note]] attaches bullets to the card whose source contains
# `anchor` (a unique substring of the file). `generate.py --check` verifies every
# anchor still resolves, so drift fails fast.

[doc]
title = "ikigai"
subtitle = "code walkthrough · M0–M3"
footer = "ikigai-core — M0–M3 code walkthrough"
intro = [
  "A side-by-side reading of the resolution kernel: identity (M0); resolution — spaces, grammars, endpoints (M1); the SPARQL and file endpoints with RDF self-description (M2); and the async kernel with content-addressed caching and resource composition (M3). Source on the left, annotations on the right, with the reasoning behind the Rust choices.",
  "Every snippet is sliced from the committed source across the workspace crates, so it matches the repository. Unit-test modules are omitted to keep the focus on the API.",
]

