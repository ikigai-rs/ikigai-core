[[file]]
path = "crates/ikigai-core/src/verb.rs"
title = "ikigai-core / verb.rs"
subtitle = "Request verbs and their cacheability"
[[file.note]]
anchor = "pub enum Verb"
bullets = [
  "Five verbs, mirroring NetKernel: Source / Sink / Exists / Delete / Meta.",
  "Explicit `#[repr(u8)]` codes feed identity hashing with a stable, version-independent byte.",
]
[[file.note]]
anchor = "pub fn is_cacheable(self)"
bullets = [
  "Cacheability is a property of the verb: only the idempotent reads (Source / Exists / Meta) may be cached; mutating verbs never are.",
