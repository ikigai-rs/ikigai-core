[package]
name = "ikigai-core"
description = "Identity, representations, resolution, content-addressed caching, and capabilities."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# The formalism gate resolves every pin in `docs/formalism/README.md` against this
# repository's tree, and `docs/` lives above this crate, so a packaged crate cannot
# carry the document the test reads. Excluded rather than taught to skip: a skip on an
# absent document is the silent pass the gate exists to refuse, and its audience is
# this repository and its CI, not a downstream running the crate's own tests.
# `tests/american_spelling.rs` reads `docs/` too, and is excluded for the same reason.
exclude = ["tests/formalism_pins.rs", "tests/american_spelling.rs"]

[dependencies]
# Dyn-compatible async traits; runtime-free (boxes the returned future), so the
# core stays executor-agnostic and WASM-able. The executor is chosen at the edge.
async-trait = "0.1"
blake3 = "1"
# Future *combinators* only (try_join_all) — runtime-free and WASM-able, so
# `compose` can fork its `$a{}` sub-resolutions and join them. Spawns nothing;
# the executor is still chosen at the edge.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
futures-channel = { version = "0.3", default-features = false, features = ["alloc", "std"] }
oxiri = "0.2"
serde = { version = "1", features = ["derive"] }
# Only under the `declare` feature: parse a declaration's Turtle
# (`Topology::from_turtle`). The floor is the version this workspace's tests have
# always parsed topology with. Runtime-free, and clean under WASI as they stand; in
# the BROWSER (wasm32-unknown-unknown) oxrdf's `rand` needs getrandom's JS backend,
# which a library can only half-enable: the feature is here (below), and the host
# still sets `--cfg getrandom_backend="wasm_js"` in its rustflags — as every browser
# host that uses ikigai-rdf already does (ikigai-web-demo, ikigai-linkeddata).
oxttl = { version = "0.2.3", optional = true }
oxrdf = { workspace = true, optional = true }

[features]
# Read a space declaration: `Topology::from_turtle`, the exact inverse of
# `Topology::to_turtle`. Opt-in, so a host that never reads a declaration pays
# nothing for an RDF parser. `build` and `Registry` need no parser and are always on.
# ⚠ The tests behind this feature run only in a job that enables it: CI's
# `features: "*"` (--all-features) is that job.
declare = ["dep:oxttl", "dep:oxrdf", "dep:getrandom"]

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# Only under `declare`, only in the browser: see oxttl/oxrdf above.
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }

[dev-dependencies]
futures = "0.3" # block_on for async tests
serde_json = "1"
# Test-only: parse the Turtle `urn:kernel:topology` emits and walk it as triples, so
# the §12.5 reachability check (`tests/topology.rs`) is a graph walk over what a
# consumer would parse, not a substring match. The same pair ikigai-vocab's tests use;
# neither enters the published library's dependency graph unless the opt-in `declare`
# feature asks for them (above).
oxttl = "0.2"
oxrdf.workspace = true
