[package]
name = "ikigai-core"
description = "Identity, representations, resolution, content-addressed caching, and capabilities."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
# Dyn-compatible async traits; runtime-free (boxes the returned future), so the
# core stays executor-agnostic and WASM-able. The executor is chosen at the edge.
async-trait = "0.1"
blake3 = "1"
# Future *combinators* only (try_join_all) — runtime-free and WASM-able, so
# `compose` can fork its `$a{}` sub-resolutions and join them. Spawns nothing;
# the executor is still chosen at the edge.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
oxiri = "0.2"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
futures = "0.3" # block_on for async tests
serde_json = "1"
