[package]
name = "ikigai-vocab"
description = "The ikigai self-description vocabulary and its RDF (Turtle) projection."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
serde_json = "1"
# path for local/workspace builds; version is what crates.io resolves on publish.
# The version is the TRUE minimum, not a family: the path dep satisfies every call
# locally, so fmt/clippy/test/CI stay green against a pin that cannot resolve on
# crates.io, and only `cargo publish --dry-run` ever sees it.
ikigai-core = { path = "../ikigai-core", version = "0.1.105" } # 0.1.105 =
# the ArgSpec shape (ledger #1547): `to_turtle` reads `InputGroup`, `ListSeparator`,
# `Arguments`, `ValueNote`, `OutputFrom`, `ArgSpec::is_enumerated` and the `examples`,
# `needs`, `values` and `groups` fields, none of which exists in 0.1.104, so the old
# 0.1.101 floor would admit a core this crate does not compile against.
# The older floors it covers: 0.1.101 = `encode_name` encoding `#` and `?` (ledger #1390),
# no new API, but `plan::process_iri` spells a plan id through it and relies on that to keep
# every `urn:plan:` IRI one path segment (ledger #1391), and `to_turtle` relies on it for an
# id or input name holding `#`; against 0.1.100 this crate compiles and mints `urn:plan:a#b`.
# `encode_name` itself is 0.1.100 (ledger #1361); then `ActionSpec::contract_iri` (0.1.91,
# ledger #948), `space_iri` (0.1.89, the name `space()` claims), `escape_iri_fragment`
# (0.1.66) and `Transreption::lossless` (0.1.77). Under 0.x caret rules this is the RANGE
# >=0.1.105, <0.2.0; the path dep satisfies it locally.

[dev-dependencies]
futures = "0.3" # block_on for the kernel faces in tests/manifold_identity.rs
# Test-only: parse-validate the bundled vocabulary.ttl / shapes.ttl / the emitted Turtle,
# and walk the plan fixtures as triples. Neither enters the published library's
# dependency graph (the crate stays dependency-free).
oxttl = "0.2"
oxrdf.workspace = true
# What "done" means for a module, run against `space()` (tests/conformance.rs). It depends on
# `ikigai-core` and `ikigai-vocab` from crates.io, which would link a SECOND copy of each beside
# this workspace's: the workspace root's `[patch.crates-io]` points both at the members here, so
# the suite and this crate share one kernel. The `ikigai-vocab` edge is a dev-dependency cycle,
# which cargo permits (an integration test links the plain library).
ikigai-conformance = "0.8.0"
