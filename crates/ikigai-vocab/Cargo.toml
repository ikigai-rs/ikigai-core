[package]
name = "ikigai-vocab"
description = "The ikigai self-description vocabulary and its RDF (Turtle) projection."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
serde_json = "1"
# path for local/workspace builds; version is what crates.io resolves on publish.
ikigai-core = { path = "../ikigai-core", version = "0.1" }

[dev-dependencies]
# Test-only: parse-validate the bundled vocabulary.ttl + the emitted Turtle. Does not
# enter the published library's dependency graph (the crate stays dependency-free).
oxttl = "0.2"
