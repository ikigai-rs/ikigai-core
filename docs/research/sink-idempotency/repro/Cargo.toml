# A reproduction for docs/research/sink-idempotency.md, NOT a workspace member: it builds the
# PUBLISHED ledger and layers modules (which name ikigai-core 0.3) from crates.io, so it has its
# own workspace and lock file and is never built by the repository's `cargo test`.
#
#     cargo run --manifest-path docs/research/sink-idempotency/repro/Cargo.toml
[package]
name = "sink-idempotency-repro"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
age = "0.11.1"
futures = "0.3"
ikigai-core = "=0.3.5"
ikigai-ledger = "=0.24.0"
ikigai-layers = "=0.10.4"
ikigai-store = "0.5.0"
ikigai-vocab = "0.3.4"
