<svg width="100%" viewBox="0 0 680 456" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <title>Resolution as a walk through the stack</title>
  <desc>Resolving issue urn:data:page: Overrides misses, Mount matches urn:data:, the nested fallback hits LocalData (Remote is not reached), and the endpoint returns the page. A loop shows compose re-entering issue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- request -->
  <rect x="210" y="44" width="220" height="44" rx="10" fill="#EAF1FB" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="320" y="71" text-anchor="middle" fill="#0C447C" font-size="13" font-family="ui-monospace, monospace">issue urn:data:page</text>

  <line x1="320" y1="88" x2="320" y2="108" stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- overrides miss -->
  <rect x="210" y="110" width="220" height="46" rx="10" fill="#F6F8FB" stroke="#C3D0E0" stroke-width="1.5"/>
  <text x="320" y="132" text-anchor="middle" fill="#334155" font-size="13" font-weight="500">Overrides</text>
  <text x="320" y="147" text-anchor="middle" fill="#94A3B8" font-size="11">miss · not pinned</text>

  <line x1="320" y1="156" x2="320" y2="176" stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- mount match -->
  <rect x="210" y="178" width="220" height="46" rx="10" fill="#EAF1FB" stroke="#2F6FBF" stroke-width="1.5"/>
  <text x="320" y="200" text-anchor="middle" fill="#0C447C" font-size="13" font-weight="500">Mount · urn:data:</text>
  <text x="320" y="215" text-anchor="middle" fill="#3E6CA3" font-size="11">prefix match</text>

  <line x1="320" y1="224" x2="320" y2="244" stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- nested fallback -->
  <rect x="190" y="246" width="260" height="96" rx="10" fill="#F6F8FB" stroke="#C3D0E0" stroke-width="1.5"/>
  <text x="202" y="264" fill="#64748B" font-size="11">fallback · first match wins ↓</text>
  <rect x="202" y="270" width="236" height="32" rx="7" fill="#DCF3EC" stroke="#0F8A66" stroke-width="1.25"/>
  <text x="214" y="290" fill="#0B5E47" font-size="12" font-weight="500">LocalData  ✓ hit</text>
  <rect x="202" y="306" width="236" height="32" rx="7" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.25"/>
  <text x="214" y="326" fill="#94A3B8" font-size="12">Remote · not reached</text>

  <line x1="320" y1="342" x2="320" y2="362" stroke="#8FA3BA" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- result -->
  <rect x="210" y="364" width="220" height="46" rx="10" fill="#DCF3EC" stroke="#0F8A66" stroke-width="1.5"/>
  <text x="320" y="386" text-anchor="middle" fill="#0B5E47" font-size="13" font-weight="500">page · computed</text>
  <text x="320" y="401" text-anchor="middle" fill="#2E7D63" font-size="11">returned to caller</text>

  <!-- re-entrancy loop -->
  <path d="M430 387 C 548 380, 548 74, 432 66" fill="none" stroke="#8B7FD6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="470" y="206" width="160" height="44" rx="8" fill="#EDE7FB" stroke="#8B7FD6" stroke-width="1.25"/>
  <text x="482" y="226" fill="#4A3E9E" font-size="11" font-family="ui-monospace, monospace">compose · $a{…}</text>
  <text x="482" y="241" fill="#4A3E9E" font-size="11">re-enters issue ↑</text>
</svg>
