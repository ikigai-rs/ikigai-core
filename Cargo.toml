[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# 0.3.1: `Error::Gone` and the typed redirect answer (ledger #3150). Additive.
# 0.3.0: held content is scoped to the principal who delivered it (ledger #2965). What still
# compiles changes: `MemoryContentStore::put` and `put_replay` are read by root alone, and so is a
# hold under a capability naming no principal. A door holding a caller's content moves to
# `put_for` or `put_replay_for`, under a capability that names the caller.
version = "0.3.2"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-core"
homepage = "https://github.com/ikigai-rs/ikigai-core"
keywords = ["resource", "rdf", "sparql", "cache", "kernel"]
categories = ["caching", "data-structures"]

[workspace.dependencies]
# core RDF foundations come from the Oxigraph crate family
oxrdf = "0.3"

# The workspace's own members, for crates.io dependents that reach back into it. That is
# `ikigai-conformance` (a dev-dependency of ikigai-vocab, OUT for the 0.3.0 bump: see its
# manifest), which names `ikigai-core` and `ikigai-vocab` by version: without this the test would
# link two kernels whose types do not unify. In-repo paths only, never a path outside the repo. A workspace-root `[patch]` is not
# published (no member's manifest carries it), so no consumer's build is redirected.
[patch.crates-io]
ikigai-core = { path = "crates/ikigai-core" }
ikigai-vocab = { path = "crates/ikigai-vocab" }
