name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      features: "*"
      # macOS too (ledger #2688): the resolution path's frame is wider in a debug build on
      # macOS aarch64 than on Linux x86_64, and a 64-deep nesting overflowed a 2 MiB test
      # thread there while every Linux job stayed green. These jobs run the debug test suite,
      # so a frame that widens again fails here first. Free on a public repo.
      macos: true
      wasm-check: true
      # The `declare` feature on wasm32 (ledger #650): `wasm-check` builds default features only, so
      # nothing in CI compiled oxttl/oxrdf/getrandom for the browser, and the claim that getrandom
      # >= 0.3.4's `wasm_js` feature needs no `--cfg getrandom_backend` flag went unchecked. This job
      # lints core's lib on wasm32 with `declare` on and no RUSTFLAGS: if the claim stops holding, it
      # goes red here rather than in a host.
      wasm-lib: true
      wasm-packages: ikigai-core
      wasm-features: declare

  walkthrough:
    name: walkthrough anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Verifies every annotation anchor still resolves against the source, so
      # the walkthrough can't drift from the code. No fonts / reportlab needed.
      - name: Check walkthrough anchors
        run: python3 tools/walkthrough/generate.py --check
