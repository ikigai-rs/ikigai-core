name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      features: "*"
      wasm-check: true

  walkthrough:
    name: walkthrough anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Verifies every annotation anchor still resolves against the source, so
      # the walkthrough can't drift from the code. No fonts / reportlab needed.
      - name: Check walkthrough anchors
        run: python3 tools/walkthrough/generate.py --check
